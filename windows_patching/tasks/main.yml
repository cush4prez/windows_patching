---
- name: Gather Windows OS distribution facts
  ansible.windows.setup:
    gather_subset:
      - distribution

- name: Capture current OS version
  ansible.builtin.set_fact:
    pre_patch_os_version: "{{ ansible_facts['distribution_version'] }}"

- name: Ensure Expected windows version
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] | string == expected_os_major_version | string
      - ansible_facts['distribution_minor_version'] | string == expected_os_minor_version | string
    fail_msg: >-
      Expected OS {{ expected_os_major_version }}.{{ expected_os_minor_version }},
      but found {{ ansible_facts['distribution_major_version'] }}.{{ ansible_facts['distribution_minor_version'] }}.
  when:
    - expected_os_major_version | default('') | string | length > 0
    - expected_os_minor_version | default('') | string | length > 0

- name: End Necessary services
  ansible.builtin.include_tasks: services.yml
  when: user_stopped_services | default([]) | length > 0

- name: Perform Windows Patch
  ansible.builtin.include_tasks: patching.yml

- name: Verify Patching took place
  block:
    - name: Pull updated vars
      ansible.windows.setup:
        gather_subset:
          - distribution

    - name: Verify version change
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution_version'] is ansible.builtin.version(pre_patch_os_version, '>')
      register: version_return

  rescue:
    - name: Display failure if version not updated
      ansible.builtin.debug:
        msg: "Patching failed, still on pre patch os version ({{ ansible_facts['distribution_version'] }})"
      when: version_return is failed
